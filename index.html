<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>我的私人数据面板</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        textarea { width: 100%; height: 150px; margin-top: 10px; }
        button { margin-top: 10px; padding: 10px 20px; cursor: pointer; }
        #app { display: none; } /* 默认隐藏，验证Token后显示 */
        .error { color: red; }
    </style>
</head>
<body>

    <div id="login-section">
        <h3>🔐 请输入 GitHub Token 访问</h3>
        <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx" style="width: 100%; padding: 8px;">
        <button onclick="verifyToken()">进入系统</button>
    </div>

    <div id="app">
        <h3>📦 数据编辑器</h3>
        <p>当前数据：</p>
        <textarea id="data-area"></textarea>
        <br>
        <button onclick="saveData()">💾 保存修改到 GitHub</button>
        <p id="status"></p>
    </div>

    <script>
        // 配置你的用户名和仓库名
        const USERNAME = '你的GitHub用户名'; 
        const REPO = '你的仓库名';
        const FILE_PATH = 'data.json';
        
        let userToken = '';
        let fileSha = ''; // GitHub API 写入文件需要提供文件的 SHA 哈希值

        // 1. 验证 Token 并获取数据
        async function verifyToken() {
            const input = document.getElementById('token-input').value;
            if (!input) return alert('请输入 Token');
            
            userToken = input;
            const url = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FILE_PATH}`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `token ${userToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!response.ok) throw new Error('Token 无效或无法访问文件');

                const data = await response.json();
                
                // 解码 Base64 内容 (GitHub API 返回的内容是 Base64 编码的)
                // 使用 decodeURIComponent(escape(window.atob(str))) 解决中文乱码问题
                const content = decodeURIComponent(escape(window.atob(data.content)));
                
                document.getElementById('data-area').value = content;
                fileSha = data.sha; // 保存 SHA，更新时必须用到

                // 切换显示
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('app').style.display = 'block';

            } catch (err) {
                alert('登录失败: ' + err.message);
            }
        }

        // 2. 保存数据回 GitHub
        async function saveData() {
            const newContent = document.getElementById('data-area').value;
            const status = document.getElementById('status');
            status.innerText = '正在保存...';

            // 编码为 Base64
            const contentBase64 = window.btoa(unescape(encodeURIComponent(newContent)));

            const url = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FILE_PATH}`;
            
            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${userToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Update data via Web', // Commit 信息
                        content: contentBase64,
                        sha: fileSha // 必须提供上一次的 SHA 才能覆盖
                    })
                });

                if (response.ok) {
                    const resData = await response.json();
                    fileSha = resData.content.sha; // 更新 SHA 为最新
                    status.innerText = '✅ 保存成功！数据已同步到 GitHub 库。';
                    status.style.color = 'green';
                } else {
                    throw new Error('保存失败');
                }
            } catch (err) {
                status.innerText = '❌ 保存出错: ' + err.message;
                status.style.color = 'red';
            }
        }
    </script>
</body>
</html>
