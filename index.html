<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>加密数据面板 (Public仓库也安全)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        textarea { width: 100%; height: 150px; margin-top: 10px; font-family: monospace; }
        button { margin-top: 10px; padding: 10px 20px; cursor: pointer; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        #app { display: none; }
        .hint { font-size: 0.8em; color: #666; margin-bottom: 5px; }
        .label { font-weight: bold; margin-top: 10px; display: block;}
    </style>
</head>
<body>

    <div id="login-section">
        <h3>🔐 安全登录</h3>
        
        <label class="label">1. GitHub Token (用于存取文件)</label>
        <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
        
        <label class="label">2. 加密密码 (用于加密内容)</label>
        <div class="hint">数据将使用此密码进行 AES 加密，请务必牢记！</div>
        <input type="password" id="crypto-key" placeholder="设置一个只有你知道的密码">

        <button onclick="loginAndFetch()">解密并进入</button>
    </div>

    <div id="app">
        <h3>📦 安全数据编辑器</h3>
        <p>数据状态：<span id="lock-status">🔓 已解密</span></p>
        <textarea id="data-area"></textarea>
        <br>
        <button onclick="encryptAndSave()">🔒 加密并保存到 GitHub</button>
        <p id="status"></p>
    </div>

    <script>
        // 配置
        const USERNAME = 'P1nk64'; 
        const REPO = '-';
        const FILE_PATH = 'data.json';
        
        let userToken = '';
        let cryptoKey = ''; // 加密密码
        let fileSha = '';

        // 1. 登录并拉取数据
        async function loginAndFetch() {
            userToken = document.getElementById('token-input').value;
            cryptoKey = document.getElementById('crypto-key').value;

            if (!userToken || !cryptoKey) return alert('Token 和 加密密码都必须填写');

            const url = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FILE_PATH}`;

            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${userToken}` }
                });

                if (response.status === 404) {
                    // 如果文件不存在，允许初始化
                    if(confirm("文件不存在，是否初始化一个新文件？")) {
                        enterApp(""); //以此进入空编辑模式
                        return;
                    }
                }
                if (!response.ok) throw new Error('Token 错误或网络问题');

                const data = await response.json();
                fileSha = data.sha;
                
                // GitHub 返回的是 Base64，先转回字符串
                const encryptedContent = decodeURIComponent(escape(window.atob(data.content)));
                
                // 尝试解密
                let decryptedContent = '';
                try {
                    // 如果是第一次运行（文件里是明文json），解密会失败或者乱码
                    // 这里假设文件里已经是密文
                    const bytes = CryptoJS.AES.decrypt(encryptedContent, cryptoKey);
                    decryptedContent = bytes.toString(CryptoJS.enc.Utf8);
                    
                    if (!decryptedContent && encryptedContent.length > 0) {
                        // 解密结果为空，说明密码错了
                        throw new Error('密码错误');
                    }
                } catch (e) {
                    // 如果解密失败，可能是因为文件本身还是明文（第一次使用），或者密码错了
                    // 为了简单演示，如果解密不出东西，我们提示用户
                    if (!confirm("解密失败！可能是密码错误，或者文件尚未加密。\n点击【确定】以【原文模式】显示（如果是第一次使用）。\n点击【取消】重新输入密码。")) {
                        return;
                    }
                    decryptedContent = encryptedContent; // 降级显示原文
                }

                enterApp(decryptedContent);

            } catch (err) {
                alert('错误: ' + err.message);
            }
        }

        function enterApp(content) {
            document.getElementById('data-area').value = content;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            
            // 可选：在这里把 Token 存入 localStorage 实现“缓存”
            // localStorage.setItem('gh_token', userToken);
        }

        // 2. 加密并保存
        async function encryptAndSave() {
            const rawContent = document.getElementById('data-area').value;
            const status = document.getElementById('status');
            status.innerText = '正在加密并上传...';

            // AES 加密
            const encryptedData = CryptoJS.AES.encrypt(rawContent, cryptoKey).toString();

            // 转 Base64 供 GitHub API 使用
            const contentBase64 = window.btoa(unescape(encodeURIComponent(encryptedData)));

            const url = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${FILE_PATH}`;
            
            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${userToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Save encrypted data',
                        content: contentBase64,
                        sha: fileSha
                    })
                });

                if (response.ok) {
                    const resData = await response.json();
                    fileSha = resData.content.sha;
                    status.innerText = '✅ 安全保存成功！GitHub 上现在是一堆乱码。';
                    status.style.color = 'green';
                } else {
                    throw new Error('保存失败');
                }
            } catch (err) {
                status.innerText = '❌ 错误: ' + err.message;
            }
        }
    </script>
</body>
</html>
